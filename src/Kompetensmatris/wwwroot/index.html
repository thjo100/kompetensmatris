<!doctype html>
<html lang="sv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kompetensmatris</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='11' y='2' width='10' height='7' rx='2' fill='%233d7cc9'/%3E%3Crect x='2' y='23' width='10' height='7' rx='2' fill='%233d7cc9'/%3E%3Crect x='20' y='23' width='10' height='7' rx='2' fill='%233d7cc9'/%3E%3Cpath d='M16 9v7M7 23v-7h18v7' stroke='%233d7cc9' stroke-width='2' fill='none'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">Kompetensmatris</div>
    <select id="treeSelect" aria-label="Välj träd" hidden></select>
    <div class="search">
      <input id="search" type="search" placeholder="Sök område…" aria-label="Sök område">
      <span id="searchInfo" class="muted"></span>
    </div>
    <div class="spacer"></div>
    <div class="group" role="group" aria-label="Visning">
      <button id="zoomOut" class="icon" title="Zooma ut" aria-label="Zooma ut">−</button>
      <button id="zoomReset" class="icon zoom-level" title="Återställ zoom">100%</button>
      <button id="zoomIn" class="icon" title="Zooma in" aria-label="Zooma in">+</button>
    </div>
    <div class="group" role="group">
      <button id="expandAll">Expandera alla</button>
      <button id="collapseAll">Fäll ihop</button>
    </div>
    <div id="adminTools" class="group" role="group" hidden>
      <button id="newTree">+ Nytt träd</button>
      <button id="exportBtn">Exportera</button>
      <button id="importBtn">Importera</button>
    </div>
    <button id="loginBtn" class="primary">Logga in</button>
  </header>

  <section id="courseBar" class="course-bar" aria-label="Kurser" hidden></section>
  <div id="adminHint" class="admin-hint" hidden>
    Adminläge: håll muspekaren över en ruta för att lägga till (+), redigera (✎), flytta (↑ ↓) eller ta bort (🗑).
    Klistra in en indenterad lista i en ny rad för att skapa många områden på en gång.
  </div>

  <main id="canvas" class="canvas">
    <div id="tree" class="tree"></div>
  </main>

  <dialog id="modal"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <input id="importFile" type="file" accept=".json,application/json" hidden>

  <script src="app.js"></script>
</body>
</html>
