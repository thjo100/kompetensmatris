# Starta med:  docker compose up -d --build
# Öppna sedan http://localhost:8080
services:
  kompetensmatris:
    build: .
    # Eller använd den färdiga imagen från Docker Hub:
    # image: <ditt-dockerhub-konto>/kompetensmatris:latest
    ports:
      - "8080:8080"
    environment:
      ADMIN_PASSWORD: "byt-till-ett-eget-ord"
    volumes:
      - kompetensdata:/data
    restart: unless-stopped

volumes:
  kompetensdata:
