name: Testa och bygg image

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test

  docker:
    # Bygger alltid imagen (även i pull requests, för att se att Dockerfile fungerar).
    # Den pushas till Docker Hub bara från main eller en v*-tagg, och bara om hemligheterna
    # DOCKERHUB_USERNAME och DOCKERHUB_TOKEN finns (Settings → Secrets and variables → Actions).
    needs: test
    runs-on: ubuntu-latest
    env:
      PUSH: ${{ github.event_name != 'pull_request' && secrets.DOCKERHUB_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Logga in på Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || 'lokal' }}/kompetensmatris
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha,format=short
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
